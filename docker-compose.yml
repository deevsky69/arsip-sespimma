services:
  app:
    build: .
    restart: unless-stopped
    # init: proses kecil (tini) sebagai PID 1 yang membereskan proses anak yang sudah selesai
    # (pekerja OCR / impor Drive diluncurkan sebagai proses terpisah).
    init: true
    env_file: .env
    environment:
      ARSIP_DATA_DIR: /data
      ARSIP_DI_BELAKANG_PROXY: "true"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
