# Situs ARSIP SESPIMMA di belakang nginx yang sudah ada.
# Pasang:  sudo cp deploy/nginx-arsip-sespimma.conf /etc/nginx/sites-available/arsip-sespimma
#          sudo ln -s /etc/nginx/sites-available/arsip-sespimma /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d arsip-sespimma.awansurya.com
# File ini berdiri sendiri; konfigurasi situs lain di server tidak diubah.
server {
    listen 80;
    listen [::]:80;
    server_name arsip-sespimma.awansurya.com;

    client_max_body_size 60m;   # batas unggahan PDF (aplikasi: 50 MB)

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx menambahkan IP asli pengunjung di AKHIR daftar; aplikasi hanya mempercayai entri terakhir.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
