# Untuk server yang SUDAH memakai nginx di port 80/443 (mis. bersama situs lain).
# Tidak ada Caddy: aplikasi hanya mendengarkan di 127.0.0.1 dan nginx meneruskan permintaan ke sini.
# Pakai:  docker compose -f docker-compose.nginx.yml up -d --build
# Konfigurasi nginx-nya: deploy/nginx-arsip-sespimma.conf
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ARSIP_DATA_DIR: /data
      ARSIP_DI_BELAKANG_PROXY: "true"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${ARSIP_PORT_LOKAL:-8010}:8000"
