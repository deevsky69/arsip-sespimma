# Untuk server di belakang reverse proxy yang sudah mengurus HTTPS: nginx di server yang sama, atau
# reverse proxy di router/gateway. Tidak ada Caddy; aplikasi melayani HTTP biasa.
# Alamat & port yang didengarkan diatur di .env:
#   - nginx di server yang sama : (bawaan) ARSIP_BIND=127.0.0.1, ARSIP_PORT_LOKAL=8010
#   - reverse proxy di router   : ARSIP_BIND=0.0.0.0, ARSIP_PORT_LOKAL=80
# Pakai:  docker compose -f docker-compose.nginx.yml up -d --build
# Konfigurasi nginx-nya: deploy/nginx-arsip-sespimma.conf
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ARSIP_DATA_DIR: /data
      ARSIP_DI_BELAKANG_PROXY: "true"
    volumes:
      - ./data:/data
    ports:
      - "${ARSIP_BIND:-127.0.0.1}:${ARSIP_PORT_LOKAL:-8010}:8000"
